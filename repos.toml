# Cmdlet reference of the latest Az release only (older azps-* folders are other versions of the same cmdlets). Lower weight: very many near-identical pages.
[[repo]]
name = "azure-docs-powershell"
url_base = "https://learn.microsoft.com/powershell/module"
docs_root = "azps-16.5.0"
restrict = true
weight = 0.5

# Added 2026-11-01 after the qset2 human review found these gaps (sparse shallow clones, CC-BY-4.0).
# Azure CLI: conceptual guides (Markdown) and the command reference (YAML, converted by azcli.py) share one checkout.
[[repo]]
name = "azure-cli-docs"
path = "azure-docs-cli"
url_base = "https://learn.microsoft.com/cli/azure"
docs_root = "docs-ref-conceptual/Latest-version"
restrict = true
weight = 1.0

[[repo]]
name = "azure-cli-reference"
path = "azure-docs-cli"
url_base = "https://learn.microsoft.com/cli/azure"
docs_root = "docs-ref-autogen/Latest-version/latest"
restrict = true
format = "azcli-yaml"
weight = 0.5

# Azure support / troubleshooting articles (learn.microsoft.com/troubleshoot/azure); sparse checkout of support/azure only.
[[repo]]
name = "azure-support-articles"
path = "SupportArticles-docs"
url_base = "https://learn.microsoft.com/troubleshoot/azure"
docs_root = "support/azure"
restrict = true
weight = 1.0

# Azure Key Vault (learn.microsoft.com/azure/key-vault): the GitHub source
# (MicrosoftDocs/azure-security-docs-pr) is private, so this checkout is rebuilt
# from rendered Learn markdown by `eval/crawl_learn.py` (see its RECONSTRUCTED.md).
[[repo]]
name = "azure-security-docs"
url_base = "https://learn.microsoft.com/azure/key-vault"
docs_root = "articles/key-vault"
restrict = true
weight = 1.0

# Azure Cosmos DB (learn.microsoft.com/azure/cosmos-db): the GitHub source
# (MicrosoftDocs/nosql-docs-pr) is private, so this checkout is rebuilt
# from rendered Learn markdown by `eval/crawl_learn.py` (see its RECONSTRUCTED.md).
[[repo]]
name = "nosql-docs"
url_base = "https://learn.microsoft.com/azure/cosmos-db"
docs_root = "azure/cosmos-db"
restrict = true
weight = 1.0

# Azure Database for MySQL (learn.microsoft.com/azure/mysql, flexible server mostly): the GitHub source
# (MicrosoftDocs/azure-databases-docs-pr) is private, so this checkout is rebuilt from rendered
# Learn markdown by `eval/crawl_learn.py --service mysql` (see its RECONSTRUCTED.md).
[[repo]]
name = "azure-databases-docs"
url_base = "https://learn.microsoft.com/azure/mysql"
docs_root = "articles/mysql"
restrict = true
weight = 1.0

# Terraform azurerm provider reference (resources, data sources, functions, guides): converted by `eval/convert_azurerm.py` from the
# `website/docs` of hashicorp/terraform-provider-azurerm (clone in ../terraform-provider-azurerm). Files are laid out like the registry URLs.
[[repo]]
name = "azurerm-docs"
url_base = "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs"
docs_root = "."
weight = 1.0

# AKS release notes (github.com/Azure/AKS CHANGELOG.md, one page per release): `eval/convert_aks_releases.py`, clone in ../AKS (sparse, CHANGELOG.md only).
# Files are laid out as releases/tag/<date>.md so the derived URL is the real GitHub release page.
[[repo]]
name = "aks-release-notes"
url_base = "https://github.com/Azure/AKS"
docs_root = "."
weight = 1.0

# Kubernetes upstream (kubernetes.io): docs/concepts, docs/tasks, API deprecation guide, releases/*, release + deprecation blog posts.
# `eval/convert_k8s.py` rewrites the Hugo shortcodes of the sparse clone ../kubernetes-website into ../kubernetes-docs (laid out like the site URLs).
[[repo]]
name = "kubernetes-docs"
url_base = "https://kubernetes.io"
docs_root = "."
weight = 1.0

# Azure Pipelines docs (learn.microsoft.com/azure/devops/pipelines): the GitHub source is not readable without credentials, so this checkout is rebuilt
# from rendered Learn markdown by `eval/crawl_learn.py --service devops` (see its RECONSTRUCTED.md). Added 2026-11-05 (AKS-upgrade review, Backlog 2).
[[repo]]
name = "azure-devops-docs"
url_base = "https://learn.microsoft.com/azure/devops"
docs_root = "azure/devops"
restrict = true
weight = 1.0
