url_base = "https://learn.microsoft.com/azure/architecture"
docs_root = "docs"
weight = 1.0

[[repo]]
name = "azure-rest-api-specs"
docs_root = "."
weight = 0.3

[[repo]]
name = "finops-toolkit"
url_base = "https://learn.microsoft.com/cloud-computing/finops"
