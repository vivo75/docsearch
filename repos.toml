# Added 2026-10-31: sections that moved out of azure-docs (shallow clones, history since 2026-01-01).
[[repo]]
name = "azure-aks-docs"
url_base = "https://learn.microsoft.com/azure"
docs_root = "articles"
weight = 1.0

[[repo]]
name = "azure-monitor-docs"
