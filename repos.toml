# Corpus configuration. Paths are relative to `root`; a relative `root` is resolved against this file's directory.
root = "../.."

# weight: retrieval boost (design 6.4); exclude_dirs: not standalone pages (includes/themes).
[[repo]]
name = "azure-docs"
url_base = "https://learn.microsoft.com/azure"
docs_root = "articles"
weight = 1.0

[[repo]]
name = "azure-dev-docs"
url_base = "https://learn.microsoft.com/azure/developer"
docs_root = "articles"
weight = 1.0

[[repo]]
