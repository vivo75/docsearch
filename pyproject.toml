[project]
name = "docsearch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Francesco Riosa", email = "vivo75@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
    "sqlite-vec>=0.1.9",
    "tree-sitter>=0.25.0",
    "tree-sitter-go>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pytest>=9.2.0",
]

[project.scripts]
docsearch = "docsearch.cli:main"
